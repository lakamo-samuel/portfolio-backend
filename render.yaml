services:
  - type: web
    name: kjtech-portfolio-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kjtech-portfolio-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: IP_HASH_SECRET
        generateValue: true
      - key: PORTFOLIO_ORIGIN
        sync: false
      - key: DASHBOARD_ORIGIN
        sync: false
databases:
  - name: kjtech-portfolio-db
    databaseName: kjtech_portfolio
    user: kjtech_admin
